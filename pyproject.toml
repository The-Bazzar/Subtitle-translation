[project]
name = "subtitle-translation"
version = "1.8.0.dev0"
description = "JSON-first WhisperX subtitle translation pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai>=1.0.0",
    "langcodes[data]>=3.4.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
asr = [
    "whisperx @ git+https://github.com/m-bain/whisperx.git",
]

[project.scripts]
subtitle-translation = "subtitle_translation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "core"}
packages = ["subtitle_translation", "subtitle_translation.examples"]
py-modules = [
    "batch",
    "batch_cache",
    "batch_runtime",
    "batch_scheduler",
    "merge_ass",
    "translate_srt",
    "whisper_worker",
]

[tool.setuptools.package-data]
subtitle_translation = ["examples/*", "examples/.env.example"]
